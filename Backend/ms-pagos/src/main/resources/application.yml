# ============================================================
# MS-PAGOS - Configuracion principal
# ============================================================

server:
  port: 9004
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: ms-pagos
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/pagos
    username: postgres
    password: "123"
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false

# ------------------------------------------------------------
# JWT (solo validacion; el token lo emite ms-usuarios)
# ------------------------------------------------------------
jwt:
  secret: c2FucnVjaG8tdGllbmRhLXNlY3JldC1rZXktMjAyNi1qd3Qtc2VjdXJpdHktaHMyNTY=
  expiration-ms: 3600000

# ------------------------------------------------------------
# Eureka
# ------------------------------------------------------------
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${random.value}"
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 60

# ------------------------------------------------------------
# Actuator
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.sanrucho: INFO
