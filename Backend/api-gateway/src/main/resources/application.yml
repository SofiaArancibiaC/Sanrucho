server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. ms-catalogo
        - id: ms-catalogo
          uri: lb://ms-catalogo
          predicates:
            - Path=/api/v1/productos/**
        #- id: ms-catalogo-swagger
        #  uri: lb://ms-catalogo
        #  predicates:
        #    - Path=/ms-catalogo/v3/api-docs
        #  filters:
        #    - RewritePath=/ms-catalogo/v3/api-docs, /v3/api-docs
            
        # 2. ms-pagos
        - id: ms-pagos
          uri: lb://ms-pagos
          predicates:
            - Path=/api/v1/pagos/**
            
        # 3. ms-pedidos
        - id: ms-pedidos
          uri: lb://ms-pedidos
          predicates:
            - Path=/api/v1/pedidos/**
            
        # 4. ms-usuarios
        - id: ms-usuarios
          uri: lb://ms-usuarios
          predicates:
            - Path=/api/v1/usuarios/**, /api/v1/auth/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

