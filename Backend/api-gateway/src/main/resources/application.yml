server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
          routes:
          # 1. ms-catalogo
          - id: ms-catalogo
            uri: lb://ms-catalogo
            predicates:
              - Path=/api/v1/productos/**
          # 1b. Categorias (mismo microservicio de catalogo)
          - id: ms-catalogo-categorias
            uri: lb://ms-catalogo
            predicates:
              - Path=/api/v1/categorias/**
          # Documentacion de ms-catalogo (consumida por el Swagger del gateway)
          - id: ms-catalogo-swagger
            uri: lb://ms-catalogo
            predicates:
              - Path=/ms-catalogo/v3/api-docs/**
            filters:
              - RewritePath=/ms-catalogo/(?<segment>.*), /${segment}

          # 2. ms-pagos
          - id: ms-pagos
            uri: lb://ms-pagos
            predicates:
              - Path=/api/v1/pagos/**
          - id: ms-pagos-swagger
            uri: lb://ms-pagos
            predicates:
              - Path=/ms-pagos/v3/api-docs/**
            filters:
              - RewritePath=/ms-pagos/(?<segment>.*), /${segment}

          # 3. ms-pedidos
          - id: ms-pedidos
            uri: lb://ms-pedidos
            predicates:
              - Path=/api/v1/pedidos/**
          - id: ms-pedidos-swagger
            uri: lb://ms-pedidos
            predicates:
              - Path=/ms-pedidos/v3/api-docs/**
            filters:
              - RewritePath=/ms-pedidos/(?<segment>.*), /${segment}

          # 4. ms-usuarios (no gestionado en este repo)
          - id: ms-usuarios
            uri: lb://ms-usuarios
            predicates:
              - Path=/api/v1/usuarios/**, /api/v1/auth/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Swagger unificado en http://localhost:9000/swagger-ui.html
# El desplegable permite elegir entre los 3 microservicios.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: ms-catalogo
        url: /ms-catalogo/v3/api-docs
      - name: ms-pedidos
        url: /ms-pedidos/v3/api-docs
      - name: ms-pagos
        url: /ms-pagos/v3/api-docs

