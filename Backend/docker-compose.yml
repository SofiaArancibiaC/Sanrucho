# ============================================================
# Docker Compose - Sistema Sanrucho (completo)
# ============================================================
# Levanta toda la infraestructura + microservicios Java.
# Cada imagen se compila dentro de Docker (Dockerfile multi-stage).
#
# Orden de arranque garantizado por healthchecks:
#   1. postgres                  -> arranca en paralelo
#   2. eureka-server             -> arranca en paralelo con infra
#   3. api-gateway               -> espera a eureka (healthy)
#   4. ms-usuarios, ms-catalogo, -> esperan a eureka + postgres
#      ms-pedidos, ms-pagos         + api-gateway
# ============================================================

services:

  # -- Infraestructura: Base de Datos --------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres-rdbms
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c checkpoint_timeout=30min -c max_wal_size=2GB
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: main_postgres_db
    volumes:
      - ./init-multi-db:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sanrucho-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s


  # -- Descubrimiento: Eureka Server ---------------------------
  eureka-server:
    build:
      context: .
      dockerfile: eureka/Dockerfile
    image: sanrucho-eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - sanrucho-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # -- Enrutamiento: API Gateway -------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: sanrucho-api-gateway
    container_name: api-gateway
    ports:
      - "9000:9000"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - sanrucho-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  # -- Microservicio: Catalogo -----------------------
  ms-catalogo:
    build:
      context: .
      dockerfile: ms-catalogo/Dockerfile
    image: sanrucho-ms-catalogo
    container_name: ms-catalogo
    ports:
      - "9002:9002"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 9002
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-rdbms:5432/catalogo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - sanrucho-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9002/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  # -- Microservicio: pagos -------------------------
  ms-pagos:
    build:
      context: .
      dockerfile: ms-pagos/Dockerfile
    image: sanrucho-ms-pagos
    container_name: ms-pagos
    ports:
      - "9004:9004"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 9004
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-rdbms:5432/pagos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - sanrucho-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9004/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  # -- Microservicio: pedidos -------------------------
  ms-pedidos:
    build:
      context: .
      dockerfile: ms-pedidos/Dockerfile
    image: sanrucho-ms-pedidos
    container_name: ms-pedidos
    ports:
      - "9003:9003"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 9003
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-rdbms:5432/pedidos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - sanrucho-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9003/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  # -- Microservicio: usuarios -------------------------
  ms-usuarios:
    build:
      context: .
      dockerfile: ms-usuarios/Dockerfile
    image: sanrucho-ms-usuarios
    container_name: ms-usuarios
    ports:
      - "9001:9001"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 9001
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-rdbms:5432/usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - sanrucho-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9001/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

# ============================================================
# Red compartida con nombre fijo (independiente del nombre
# de la carpeta del proyecto)
# ============================================================
networks:
  sanrucho-network:
    name: sanrucho-network

# ============================================================
# Volumen nombrado para Postgres: usa el almacenamiento
# interno de Docker en vez del overlay del contenedor, que en
# Docker Desktop (Windows/WSL2/Hyper-V) es muchísimo más lento
# para fsync y provocaba que el healthcheck marcara "unhealthy"
# ============================================================
volumes:
  postgres-data:
    name: sanrucho-postgres-data

