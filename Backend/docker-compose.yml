# Red compartida con nombre fijo (independiente del nombre
# de la carpeta del proyecto)
# ============================================================
networks:
  sanrucho-network:
    name: sanrucho-network

# ============================================================
# Volumen nombrado para Postgres: usa el almacenamiento
# interno de Docker en vez del overlay del contenedor, que en
# Docker Desktop (Windows/WSL2/Hyper-V) es muchísimo más lento
# para fsync y provocaba que el healthcheck marcara "unhealthy"
# ============================================================
