# ============================================================
# MS-PEDIDOS - Configuracion principal
# ============================================================
# bases de datos (una por tabla, segun diseno acordado):
#   - pedidos         -> datasource PRIMARIO (pedidos)
#   - detalle_pedidos -> datasource SECUNDARIO (detalle-pedidos)
# ============================================================

server:
  port: 9003
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: ms-pedidos

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  jpa:
    open-in-view: false
    show-sql: false

  mvc:
    problemdetails:
      enabled: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
            logger-level: basic

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ------------------------------------------------------------
# Datasources del microservicio
# ------------------------------------------------------------
app:
  datasource:
    pedidos:
      url: jdbc:postgresql://localhost:5433/pedidos
      username: postgres
      password: "123"
      driver-class-name: org.postgresql.Driver
    detalle-pedidos:
      url: jdbc:postgresql://localhost:5433/detalle_pedidos
      username: postgres
      password: "123"
      driver-class-name: org.postgresql.Driver
  jpa:
    ddl-auto: update
    show-sql: false

# ------------------------------------------------------------
# JWT (solo validacion; el token lo emite el servicio de auth)
# ------------------------------------------------------------
jwt:
  secret: c2FucnVjaG8tdGllbmRhLXNlY3JldC1rZXktMjAyNi1qd3Qtc2VjdXJpdHktaHMyNTY=
  expiration-ms: 3600000

# ------------------------------------------------------------
# Eureka
# ------------------------------------------------------------
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${server.port}"
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 60

# ------------------------------------------------------------
# Actuator
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.sanrucho: INFO
    cl.sanrucho.pedidos.client: INFO
