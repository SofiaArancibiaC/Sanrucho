{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanrucho - Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <main class="container my-5">
        <div class="row">
            <aside class="col-lg-3 mb-4">
                <div class="card p-3 shadow-sm border-0 filter-card">
                    <h5 class="fw-bold mb-3">Filtros</h5>

                    <div class="mb-3">
                        <label for="buscarInput" class="form-label fw-semibold">Buscar</label>
                        <input type="text" id="buscarInput" class="form-control" placeholder="Nombre o código...">
                    </div>

                    <div class="mb-3">
                        <label for="filtroCategoria" class="form-label fw-semibold">Categoría</label>
                        <select id="filtroCategoria" class="form-select">
                            <option value="0">Todas las categorías</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="filtroPrecio" class="form-label fw-semibold d-flex justify-content-between">
                            <span>Precio máximo:</span>
                            <span id="precioEtiqueta" class="fw-bold text-primary">$100.000</span>
                        </label>
                        <input type="range" class="form-range" id="filtroPrecio" min="0" max="100000" step="1000" value="100000">
                    </div>

                    <button id="btnLimpiarFiltros" class="btn btn-outline-secondary w-100 btn-sm">Limpiar Filtros</button>
                </div>
            </aside>

            <section class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0">Catálogo</h4>
                    <span id="contadorProductos" class="text-muted small">Mostrando 0 productos</span>
                </div>

                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="contenedorProductos">
                    </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/productos.js') }}"></script>
</body>
</html>

{% endblock %}
