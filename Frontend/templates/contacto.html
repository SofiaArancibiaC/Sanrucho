<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Sanrucho - contacto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    
    <div class="problema-sugerencia">
        <h1 class="borde" data-text="¿Tienes algún problema o sugerencia?">¿Tienes algún problema o sugerencia?</h1>
        <img src="/static/img/sanrio-contacto.png" alt="sanrio-contacto">
    </div>

    <div class="formulario-contacto">
        <form> <!-- action="enviar.php" method="POST"-->
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="4" required></textarea><br><br>

            <button type="submit">Enviar</button>
        </form>
    </div>
    <img class="contactanos" src="/static/img/¡Contáctanos!.png" alt="Contáctanos">
</body>
</html>
