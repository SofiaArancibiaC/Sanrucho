<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body class="body-login">

    <div class="login-container registro-container">
        <a href="{{ url_for('inicio') }}" class="boton-volver">← Volver</a>
        <h2>Crear Cuenta</h2>
        
        <form action="{{ url_for('registro') }}" method="POST" class="row g-3 needs-validation" novalidate>
            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                <div class="invalid-feedback">Por favor, ingresa tu nombre.</div>
            </div>

            <div>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@correo.com">
                <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
            </div>

            <div>
                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repite tu contraseña">
                <div class="invalid-feedback">Confirma tu contraseña.</div>
            </div>

            <button type="submit">Registrarse</button>

            <div class="login-footer">
                ¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/validaciones.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
