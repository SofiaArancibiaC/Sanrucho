{% extends 'base.html' %}

{% block content %}
    <main class="container my-5 d-flex justify-content-center">
        <div class="login-container">
            <a href="{{ url_for('home') }}" class="d-inline-block mb-3 text-decoration-none">← Volver</a>
            <h2 class="mb-4">Iniciar Sesión</h2>

            <form class="needs-validation" novalidate method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="tu@correo.com">
                    <div class="invalid-feedback">Por favor, ingresa tu correo electrónico.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="********">
                    <div class="invalid-feedback">Por favor, ingresa tu contraseña.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>

                <div class="login-footer text-center">
                    ¿No tienes una cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>
    <script src="{{ url_for('static', filename='js/validaciones.js') }}"></script>
{% endblock %}
