<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_desc %}Panel de administración de Sanrucho{% endblock %}">
    <title>{% block title %}Panel de Administración{% endblock %}</title>

    <!-- Bootstrap 5 + Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- DataTables (usado por la tabla admin de productos) -->
    <link href="https://cdn.datatables.net/1.13.11/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <!-- Estilos base: compartidos por todas las páginas -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">

    <!-- Bloque para que cada página agregue sus propios estilos -->
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Barra superior compartida -->
    <!-- Barra superior compartida -->
<!-- Barra superior compartida -->
<!-- Barra superior compartida -->
<header class="topbar">
    <div class="topbar-brand d-flex align-items-center">
        <!-- Solo la imagen del logo -->
        <a href="{{ url_for('home') }}" class="d-flex align-items-center text-decoration-none">
            <img src="{{ url_for('static', filename='img/logo-sanrucho.png') }}" 
                 alt="Sanrucho" 
                 style="height: 48px; width: auto; object-fit: contain;">
        </a>
    </div>

    <!-- Navegación común -->
    <nav class="topbar-nav d-flex align-items-center">
        {% block nav %}
        <a href="{{ url_for('home') }}">Inicio</a>
        <a href="{{ url_for('productos') }}">Productos</a>
        <a href="{{ url_for('blog') }}">Blog</a>
        <!-- Enlace exclusivo para Dueño/Admin -->
        <a href="{{ url_for('admin') }}" id="navAdminItem" style="display: none;">Panel Admin</a>
        {% endblock %}
    </nav>

    <!-- Sección derecha: Carrito y Control de Sesión -->
    <div class="topbar-user d-flex align-items-center gap-3">
        <!-- Ícono del Carrito con Badge de cantidad -->
        <a href="{{ url_for('carrito') }}" class="btn btn-sm btn-outline-accent position-relative d-inline-flex align-items-center me-2" title="Ver carrito">
            <i class="bi bi-cart3 fs-5"></i>
            <span id="carritoBadge" 
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                  style="display: none; font-size: 0.72rem;">
                0
            </span>
        </a>

        <!-- 1. Visto si NO hay sesión iniciada -->
        <div id="navInvitado" class="d-flex align-items-center gap-2">
            <a href="{{ url_for('login') }}" class="btn btn-sm btn-outline-accent">Iniciar sesión</a>
            <a href="{{ url_for('registro') }}" class="btn btn-sm btn-accent">Registrarse</a>
        </div>

        <!-- 2. Visto si HAY sesión iniciada -->
        <div id="navUsuario" class="align-items-center gap-2" style="display: none;">
            <span class="me-2">Hola, <strong id="navUsuarioNombre">Usuario</strong></span>
            <a href="#" id="btnCerrarSesion" class="btn btn-sm btn-outline-danger">Cerrar sesión</a>
        </div>
    </div>
</header>

    <!-- Contenido principal de cada página -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de página compartido -->
    {% include '_footer.html' %}

    <!-- Modales: cada vista agrega aquí los suyos -->
    {% block modals %}{% endblock %}

    <!-- Toast de notificaciones (usado por mostrarToast() en base.js) -->
    <div class="toast" id="toast"></div>

    <!-- Librerías compartidas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.11/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.11/js/dataTables.bootstrap5.min.js"></script>

    <!-- JS base del sitio -->
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    <script src="{{ url_for('static', filename='js/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/validaciones.js') }}"></script>

    <!-- Bloque para que cada página agregue su propio JS -->
    {% block extra_js %}{% endblock %}
</body>
</html>
