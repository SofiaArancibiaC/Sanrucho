<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Sanrucho - inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">

<body>

    <div class="bienvenidos" >
        <img src="/static/img/Sanrucho-Bienvenidos.png">
    </div>
    
    <div id="carouselExampleAutoplaying" class="carousel carousel-dark slide w-75 mx-auto" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
            <img src="/static/img/blindbox-sanrio1.webp" class="d-block w-60 mx-auto" alt="blindbox">
            </div>
            <div class="carousel-item">
            <img src="/static/img/sanrio-figuras.webp" class="d-block w-60 mx-auto" alt="figura">
            </div>
            <div class="carousel-item">
            <img src="/static/img/llaveros-sanrio2.webp" class="d-block w-60 mx-auto" alt="llaveros">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>

<div class="algunos-productos">
    <h1 data-text="Algunos de nuestros productos:">Algunos de nuestros productos:</h1>
</div>

<div class="cartas my-5">
  <div class="row g-4 justify-content-center">
    <!-- TARJETA 1 -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="card flip-card-front text-center p-4 shadow">
            <div class="card-body">
              <img src="/static/img/peluche-cinna-verano.webp">
            </div>
          </div>
          <div class="card flip-card-back text-center p-4 shadow bg-white text-black">
            <div class="card-body">
              <h3 class="card-title">¡Nuevo!</h3>
              <p class="card-text">Peluche de Cinnamoroll, versión verano 2026.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TARJETA 2 -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="card flip-card-front text-center p-4 shadow">
            <div class="card-body">
              <img src="/static/img/pochacco.webp">
            </div>
          </div>
          <div class="card flip-card-back text-center p-4 shadow bg-white text-black">
            <div class="card-body">
              <h3 class="card-title">Un clásico.</h3>
              <p class="card-text">Bloques para armar una figura de Pochacco.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TARJETA 3 -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="card flip-card-front text-center p-4 shadow">
            <div class="card-body">
              <img src="/static/img/blindbox-sanrio2.webp">
            </div>
          </div>
          <div class="card flip-card-back text-center p-4 shadow bg-white text-black">
            <div class="card-body">
              <h3 class="card-title">¡Recién llegados!</h3>
              <p class="card-text">Nuevas blindbox de nuestros queridos personajes de Sanrio</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

    <div class="container my-5">
        <!-- row activa el diseño horizontal -->
        <div class="row align-items-center text-center">
            <!--img izq-->
            <div class="col-md-3 mb-3 mb-md-0">
                <img src="/static/img/gudetama1.png" alt="Izquierda" class="img-fluid rounded">
            </div>
            
            <div class="col-md-6 mb-3 mb-md-0">
                <a href="{{ url_for('login') }}">
                    <button class="btn shadow-effect"> <h1>Inicia Sesión para comprar</h1> </button>
                </a>
            </div>
            <!--img derecha-->
            <div class="col-md-3">
                <img src="/static/img/keroppi1.png" alt="Derecha" class="img-fluid rounded">
            </div>

        </div>
    </div>
    <div class="crear-cuenta">
        <h1>
            <a href="{{ url_for('registro') }}">O crea una cuenta</a>
        </h1>
    </div>
    <script src="/static/js/validaciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
